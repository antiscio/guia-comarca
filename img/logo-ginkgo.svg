<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Logo provisorio de Ginkgo (azul, letras blancas y hojas de ginkgo doradas), hasta tener el original -->
  <defs>
    <radialGradient id="fondo" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2f6390"/>
      <stop offset="1" stop-color="#173c5e"/>
    </radialGradient>
    <!-- hoja de ginkgo: abanico con muesca al centro -->
    <path id="hoja" d="M0 0L-13-20C-9-25-3-26 0-22 3-26 9-25 13-20Z"/>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#fondo)"/>
  <g fill="#fff" font-family="Ubuntu, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="100" y="66" font-size="11" letter-spacing=".5">departamentos</text>
    <text x="100" y="104" font-size="44" font-weight="500" letter-spacing="-.5">ginkgo</text>
    <text x="100" y="124" font-size="17">patagonia</text>
  </g>
  <g transform="translate(22 42) scale(.8)">
  <g fill="none" stroke="#d9b45a" stroke-width="1.4" stroke-linecap="round">
    <path d="M112 176c4-12 10-22 20-30"/>
    <path d="M124 160c6-2 12-2 18 1"/>
  </g>
  <g fill="#d9b45a">
    <use href="#hoja" transform="translate(132 146) rotate(35) scale(1.15)"/>
    <use href="#hoja" transform="translate(142 161) rotate(80)"/>
    <use href="#hoja" transform="translate(116 168) rotate(-25) scale(.9)" opacity=".85"/>
  </g>
  </g>
</svg>
