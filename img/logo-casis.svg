<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150">
  <!-- Logo provisorio: rama de casis (grosella negra) con el racimo colgando -->
  <!-- hoja de tres lóbulos, en punta -->
  <g transform="translate(150 24) rotate(48) scale(.95)" stroke="#5a2846" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 0L-9-4-19-11-21-17-13-16-10-24-6-33 0-38 6-33 10-24 13-16 21-17 19-11 9-4Z" fill="#efe5ea" stroke-width="1.6"/>
    <path d="M0 0L0-32M0-8L-16-14M0-8L16-14" fill="none" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#5a2846" stroke-linecap="round">
    <!-- rama -->
    <path d="M76 26c22-8 50-9 75-2" stroke-width="2.2"/>
    <!-- eje del racimo, cayendo -->
    <path d="M108 22c3 16 4 32 10 46 3 8 8 15 13 20" stroke-width="1.8"/>
    <!-- cabitos de cada fruto -->
    <g stroke-width="1.4">
      <path d="M109 33c-6 3-10 8-11 15"/>
      <path d="M111 44c5 2 9 7 10 13"/>
      <path d="M113 56c-5 3-8 9-8 15"/>
      <path d="M117 66c5 2 8 7 9 13"/>
      <path d="M123 77c-4 3-8 8-9 14"/>
      <path d="M129 85c4 2 6 6 7 10"/>
    </g>
  </g>
  <g fill="#5a2846">
    <circle cx="97" cy="56" r="9.6"/>
    <circle cx="122" cy="65" r="9.2" fill="#653652"/>
    <circle cx="104" cy="79" r="8.8" fill="#70445d"/>
    <circle cx="127" cy="87" r="8.2" fill="#795067"/>
    <circle cx="113" cy="99" r="7.6" fill="#856074"/>
    <circle cx="136" cy="102" r="7" fill="#957485"/>
  </g>
  <!-- brillo -->
  <g fill="#fff" opacity=".45">
    <circle cx="124.2" cy="84" r="1.7"/><circle cx="110.6" cy="96.4" r="1.6"/><circle cx="133.8" cy="99.6" r="1.5"/>
    <circle cx="93.5" cy="52.5" r="2.2"/><circle cx="118.8" cy="61.6" r="2"/><circle cx="100.8" cy="75.8" r="1.9"/>
  </g>
  <text x="120" y="138" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="3" fill="#2b2724">Cassis</text>
</svg>
